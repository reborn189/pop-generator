const getGeminiApiKey = () => {
    let key = sessionStorage.getItem('GEMINI_API_KEY') || '';
    if (!key) {
        key = window.prompt(
            'Masukkan Gemini API Key untuk menggunakan fitur AI.\n\n' +
            'Key hanya disimpan sementara di tab browser ini (sessionStorage), bukan di file website.'
        ) || '';
        if (key)
            sessionStorage.setItem('GEMINI_API_KEY', key.trim());
    }
    return key.trim();
};
const fetchWithRetry = async (url, options, retries = 3) => {
    for (let i = 0; i < retries; i++) {
        try {
            let requestUrl = url;
            let requestOptions = options;
            // Mode Android-friendly: Gemini dipanggil langsung dari browser,
            // sehingga tidak membutuhkan folder netlify/functions.
            if (url.includes('/.netlify/functions/gemini')) {
                const request = JSON.parse(options?.body || '{}');
                const apiKey = getGeminiApiKey();
                if (!apiKey)
                    throw new Error('Gemini API Key belum diisi.');
                const model = request.type === 'image'
                    ? 'gemini-2.5-flash-image-preview'
                    : 'gemini-2.5-flash';
                requestUrl =
                    `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
                requestOptions = {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(request.payload)
                };
            }
            const response = await fetch(requestUrl, requestOptions);
            if (!response.ok) {
                const detail = await response.text().catch(() => '');
                throw new Error(`HTTP ${response.status}: ${detail || response.statusText}`);
            }
            return await response.json();
        }
        catch (err) {
            if (i === retries - 1)
                throw err;
            await new Promise(r => setTimeout(r, 1000 * Math.pow(2, i)));
        }
    }
};

            const offCanvas = document.createElement('canvas');
            const w = rawImg.width;

            const ctx = offCanvas.getContext('2d', { willReadFrequently: true });

            const imageData = ctx.getImageData(0, 0, w, h);
            const data = imageData.data;
            let transp = 0;
            const corners = [0, (w - 1) * 4, (h - 1) * w * 4, ((h - 1) * w + w - 1) * 4];
            corners.forEach(idx => { if (data[idx + 3] < 50)
                transp++; });
            if (transp >= 2) {
                setBgLess(rawImg);
                setLoadingMsg('');
                setRenderTrigger(p => p + 1);
                return;

            let cR = 0, cG = 0, cB = 0;
            corners.forEach(idx => { cR += data[idx]; cG += data[idx + 1]; cB += data[idx + 2]; });

            const tG = cG / 4;
            const tB = cB / 4;
            const visited = new Uint8Array(w * h);
            const queue = new Int32Array(w * h);
            let qHead = 0, qTail = 0;

                if (x < 0 || x >= w || y < 0 || y >= h)
                    return;
                const idx = y * w + x;
                if (visited[idx] === 0) {
                    visited[idx] = 1;
                    queue[qTail++] = idx;
                }
            };
            for (let x = 0; x < w; x++) {
                for (let d = 0; d < 3; d++) {
                    pushToQueue(x, d);
                    pushToQueue(x, h - 1 - d);
                }
            }
            for (let y = 0; y < h; y++) {
                for (let d = 0; d < 3; d++) {
                    pushToQueue(d, y);
                    pushToQueue(w - 1 - d, y);
                }
            }
            while (qHead < qTail) {
                const idx = queue[qHead++];
                const x = idx % w;
                const y = Math.floor(idx / w);
                const i = idx * 4;
                const dist = Math.sqrt(Math.pow(data[i] - tR, 2) + Math.pow(data[i + 1] - tG, 2) + Math.pow(data[i + 2] - tB, 2));
                if (dist <= bgTol) {
                    visited[idx] = 2;
                    pushToQueue(x + 1, y);
                    pushToQueue(x - 1, y);
                    pushToQueue(x, y + 1);
                    pushToQueue(x, y - 1);
                }
            }
            for (let i = 0; i < w * h; i++) {
                if (visited[i] === 2) {
                    data[i * 4 + 3] = 0;
                }
            }
